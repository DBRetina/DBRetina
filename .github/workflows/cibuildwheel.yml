name: cibuildwheel

# on: [push, pull_request]
on: [push]

jobs:
  build_wheels:
    strategy:
      matrix:
        os: ["ubuntu-latest"]

    name: Build wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build wheels
        uses: pypa/cibuildwheel@v2.23.0

        env:
          CIBW_BUILD_VERBOSITY: 3
          CIBW_BUILD: cp312-manylinux_x86_64 cp313-manylinux_x86_64
          CIBW_SKIP: pp* *-manylinux_{aarch64,ppc64le,s390x}
          CIBW_ARCHS_LINUX: x86_64
          CIBW_MANYLINUX_X86_64_IMAGE: quay.io/pypa/manylinux_2_28_x86_64:latest
          CIBW_BEFORE_ALL: |
            dnf install -y epel-release
            dnf install -y https://apache.jfrog.io/artifactory/arrow/almalinux/8/apache-arrow-release-latest.rpm
            dnf install -y arrow-devel parquet-devel bzip2 bzip2-devel zlib-devel boost-devel

      - uses: actions/upload-artifact@v4
        with:
          path: ./wheelhouse/*

  upload_pypi_test:
    needs: build_wheels
    if: contains(github.event.head_commit.message, 'pypi_test')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        id: fetch_artifacts
        with:
          path: "wheels/"

      - name: Publish package to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          user: __token__
          password: ${{ secrets.TEST_PYPI_DBRETINA_API_KEY }}
          repository_url: https://test.pypi.org/legacy/
          packages_dir: ${{steps.fetch_artifacts.outputs.download-path}}/artifact/
          skip_existing: true
          verbose: true

  upload_pypi_release:
    needs: build_wheels
    runs-on: ubuntu-latest
    if: contains(github.event.head_commit.message, 'pypi_release')
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        id: fetch_artifacts
        with:
          path: "wheels/"

      - name: Publish package to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          user: __token__
          password: ${{ secrets.PYPI_DBRETINA_API_KEY }}
          packages_dir: ${{steps.fetch_artifacts.outputs.download-path}}/artifact/
          skip_existing: true
          verbose: true
