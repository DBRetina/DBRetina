[build-system]
requires = ["scikit-build-core>=0.10", "nanobind>=2.4.0"]
build-backend = "scikit_build_core.build"

[project]
name = "DBRetina"
version = "2.2.11"
description = "DBRetina Python Package"
readme = "README.md"
license = {text = "BSD-3-Clause"}
requires-python = ">=3.12"
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Development Status :: 3 - Alpha",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "Click>=8.1.4",
    "pandas>=2.0.3",
    "scipy>=1.11.1",
    "numpy>=1.25",
    "rustworkx>=0.13.0",
    "tqdm>=4.65.0",
    "seaborn>=0.12.2",
    "matplotlib>=3.7.2",
    "fastcluster>=1.2.6",
    "leidenalg>=0.10.0",
    "igraph>=0.10.5",
    "plotly>=5.15.0",
    "dash_bio>=1.0.2",
    "pycirclize>=0.4.0",
    "networkx>=3.1",
    "dash>=1.19.0",
    "visdcc>=0.0.40",
    "dash_core_components>=1.15.0",
    "dash_html_components>=1.1.2",
    "dash_bootstrap_components>1.4.0",
]

[project.scripts]
DBRetina = "dbretina:cli"

[project.urls]
"Bug Reports" = "https://github.com/DBRetina/DBRetina/issues"
"Source" = "https://github.com/DBRetina/DBRetina"

[tool.scikit-build]
cmake.build-type = "Release"
wheel.packages = ["pydbretina/dbretina"]
wheel.install-dir = "."
